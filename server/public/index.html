<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Nasfonía</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Login -->
  <section id="login" class="login hidden">
    <form id="login-form" class="login-card">
      <img src="icon.svg" alt="" class="login-logo">
      <h1>Nasfonía</h1>
      <p class="muted">Tu música, en tu NAS.</p>
      <label for="login-username">Usuario</label>
      <input id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="login-password">Contraseña</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <p class="muted hint">¿Primera vez? Entra con el usuario <strong>admin</strong> y la contraseña <strong>adminadmin</strong>.</p>
      <p id="login-error" class="error"></p>
      <button type="submit" class="btn-primary">Iniciar sesión</button>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <nav class="panel nav">
        <a href="#/" class="nav-link" data-nav="home"><span data-icon="home"></span>Inicio</a>
        <a href="#/search" class="nav-link" data-nav="search"><span data-icon="search"></span>Buscar</a>
      </nav>
      <section class="panel library">
        <header class="library-head">
          <a href="#/library" class="nav-link"><span data-icon="library"></span>Tu biblioteca</a>
          <button class="icon-btn" data-action="new-playlist" title="Crear playlist"><span data-icon="add"></span></button>
        </header>
        <div class="chips" id="lib-chips">
          <button class="chip active" data-lib="playlists">Playlists</button>
          <button class="chip" data-lib="albums">Álbumes</button>
          <button class="chip" data-lib="artists">Artistas</button>
        </div>
        <div class="lib-list" id="lib-list"></div>
      </section>
    </aside>

    <main class="main panel" id="main">
      <header class="topbar" id="topbar">
        <div class="history">
          <button class="round-btn" onclick="history.back()" title="Atrás"><span data-icon="chevronLeft"></span></button>
          <button class="round-btn" onclick="history.forward()" title="Adelante"><span data-icon="chevronRight"></span></button>
        </div>
        <div class="search-box hidden" id="search-box">
          <span data-icon="search"></span>
          <input id="search-input" type="search" placeholder="¿Qué quieres escuchar?" autocomplete="off">
        </div>
        <div class="top-actions">
          <button class="round-btn" data-action="user-menu" title="Opciones"><span data-icon="person"></span></button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </main>

    <aside class="panel queue-panel hidden" id="queue-panel"></aside>

    <nav class="mobile-nav">
      <a href="#/" data-nav="home"><span data-icon="home"></span>Inicio</a>
      <a href="#/search" data-nav="search"><span data-icon="search"></span>Buscar</a>
      <a href="#/library" data-nav="library"><span data-icon="library"></span>Biblioteca</a>
    </nav>

    <footer class="player" id="player">
      <button class="icon-btn np-collapse" id="btn-collapse-player" title="Cerrar"><span data-icon="chevronDown"></span></button>
      <div class="np" id="np-bar">
        <div class="np-cover cover" id="np-cover"></div>
        <div class="np-text">
          <a class="np-title" id="np-title"></a>
          <a class="np-artist" id="np-artist"></a>
        </div>
        <button class="icon-btn np-fav" id="np-fav" data-action="fav-current" title="Me gusta"><span data-icon="heartOutline"></span></button>
      </div>
      <div class="controls">
        <div class="buttons">
          <button class="icon-btn" id="btn-shuffle" title="Aleatorio"><span data-icon="shuffle"></span></button>
          <button class="icon-btn" id="btn-prev" title="Anterior"><span data-icon="prev"></span></button>
          <button class="play-btn" id="btn-play" title="Reproducir"><span data-icon="play"></span></button>
          <button class="icon-btn" id="btn-next" title="Siguiente"><span data-icon="next"></span></button>
          <button class="icon-btn" id="btn-repeat" title="Repetir"><span data-icon="repeat"></span></button>
        </div>
        <div class="progress">
          <span class="time" id="time-cur">0:00</span>
          <input type="range" id="seek" class="slider" min="0" max="1000" value="0" aria-label="Posición">
          <span class="time" id="time-total">0:00</span>
        </div>
      </div>
      <div class="extras">
        <button class="icon-btn" id="btn-lyrics" title="Letra"><span data-icon="lyrics"></span></button>
        <button class="icon-btn" id="btn-queue" title="Cola"><span data-icon="queue"></span></button>
        <button class="icon-btn" id="btn-mute" title="Silenciar"><span data-icon="volume"></span></button>
        <input type="range" id="volume" class="slider volume" min="0" max="100" value="80" aria-label="Volumen">
      </div>
    </footer>
  </div>

  <div id="menu" class="menu hidden" role="menu"></div>
  <div id="modal" class="modal hidden"></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
